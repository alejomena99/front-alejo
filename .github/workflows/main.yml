name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GCR_CONFIG
        env: # Or as an environment variable
          GCR_KEY: ${{ secrets.GCR_KEY }}
        run: |
          echo "$GCR_KEY" > ${HOME}/gcr-key.json
          gcloud auth activate-service-account --key-file=${HOME}/gcr-key.json
          gcloud config set project centered-moon-319616
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t josh:1.0.0 .

      - name: Tag Docker image for GCR
        run: |
          docker tag josh:1.0.0 us-central1-docker.pkg.dev/centered-moon-319616/gcr-satrack/josh:1.0.0 

      - name: Push Docker image to GCR
        run: |
          docker push us-central1-docker.pkg.dev/centered-moon-319616/gcr-satrack/josh:1.0.0
